name: ai-gateway-example

x-gateway-service: &gateway-service
  image: lean-ai-gateway-example:local
  build:
    context: ..
    dockerfile: Dockerfile
  environment: &gateway-environment
    GATEWAY_DATABASE_URL: >-
      mysql+asyncmy://${MYSQL_USER:?MYSQL_USER is required}:${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}@mysql:3306/${MYSQL_DATABASE:?MYSQL_DATABASE is required}
    GATEWAY_ENCRYPTION_KEY: ${GATEWAY_ENCRYPTION_KEY:?GATEWAY_ENCRYPTION_KEY is required}
    GATEWAY_ENVIRONMENT: ${GATEWAY_ENVIRONMENT:?GATEWAY_ENVIRONMENT is required (development or production)}
    GATEWAY_JWT_SECRET: ${GATEWAY_JWT_SECRET:?GATEWAY_JWT_SECRET is required}
    GATEWAY_LOG_LEVEL: INFO
    GATEWAY_NO_PROXY: 127.0.0.1,localhost,mysql
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  mysql:
    image: mysql:8.4@sha256:3466ba4a4828aa8d46fb7c3bc16b67b781c98413cf4ea0fac6feaa6e881faa26
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$$MYSQL_PASSWORD"
          mysql --protocol=TCP --host=127.0.0.1 --connect-timeout=3
          --user="$$MYSQL_USER" --database="$$MYSQL_DATABASE"
          --batch --skip-column-names --execute="SELECT 1" >/dev/null
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  setup:
    <<: *gateway-service
    environment:
      <<: *gateway-environment
      GATEWAY_DATABASE_URL: >-
        mysql+asyncmy://root:${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}@mysql:3306/${MYSQL_DATABASE:?MYSQL_DATABASE is required}
    depends_on:
      mysql:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - alembic upgrade head
    restart: "no"

  gateway:
    <<: *gateway-service
    depends_on:
      mysql:
        condition: service_healthy
      setup:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  mysql-data:
