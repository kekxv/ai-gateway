services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: gateway
      MYSQL_PASSWORD: gateway
      MYSQL_ROOT_PASSWORD: gateway-root
      MYSQL_USER: gateway
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ugateway", "-pgateway"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
