[project]
name = "lean-ai-gateway"
version = "0.1.0"
description = "A focused multi-provider AI gateway"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic",
    "argon2-cffi",
    "asyncmy",
    "cryptography",
    "fastapi",
    "httpx[socks]",
    "orjson",
    "pydantic-settings",
    "pyjwt[crypto]",
    "pyotp",
    "sqlalchemy[asyncio]",
    "tiktoken",
    "uvicorn[standard]",
    "websockets",
]

[dependency-groups]
dev = [
    "freezegun",
    "httpx2",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "respx",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_gateway"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ai_gateway"]
mypy_path = "src"
