services:
  mysql:
    image: mysql:8.4@sha256:3466ba4a4828aa8d46fb7c3bc16b67b781c98413cf4ea0fac6feaa6e881faa26
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./scripts/mysql-init.sh:/docker-entrypoint-initdb.d/20-runtime-privileges.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$$MYSQL_PASSWORD"
          mysql --protocol=TCP --host=127.0.0.1 --connect-timeout=3
          --user="$$MYSQL_USER" --database="$$MYSQL_DATABASE"
          --batch --skip-column-names --execute="SELECT 1" >/dev/null
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  setup:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      GATEWAY_BOOTSTRAP_ADMIN_EMAIL: ${GATEWAY_BOOTSTRAP_ADMIN_EMAIL:-}
      GATEWAY_BOOTSTRAP_ADMIN_PASSWORD: ${GATEWAY_BOOTSTRAP_ADMIN_PASSWORD:-}
      GATEWAY_BOOTSTRAP_ADMIN_TOTP_SECRET: ${GATEWAY_BOOTSTRAP_ADMIN_TOTP_SECRET:-}
      GATEWAY_ENVIRONMENT: production
      GATEWAY_JWT_SECRET: ${GATEWAY_JWT_SECRET:?GATEWAY_JWT_SECRET is required}
      GATEWAY_ENCRYPTION_KEY: ${GATEWAY_ENCRYPTION_KEY:?GATEWAY_ENCRYPTION_KEY is required}
      GATEWAY_DATABASE_URL: >-
        mysql+asyncmy://root:${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}@mysql:3306/${MYSQL_DATABASE:?MYSQL_DATABASE is required}
    depends_on:
      mysql:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - |
        alembic upgrade head
        python scripts/create_admin.py \
          --email-env GATEWAY_BOOTSTRAP_ADMIN_EMAIL \
          --password-env GATEWAY_BOOTSTRAP_ADMIN_PASSWORD \
          --totp-secret-env GATEWAY_BOOTSTRAP_ADMIN_TOTP_SECRET \
          --skip-if-all-empty
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      GATEWAY_BOOTSTRAP_ADMIN_EMAIL: ""
      GATEWAY_BOOTSTRAP_ADMIN_PASSWORD: ""
      GATEWAY_BOOTSTRAP_ADMIN_TOTP_SECRET: ""
      GATEWAY_ENVIRONMENT: production
      GATEWAY_JWT_SECRET: ${GATEWAY_JWT_SECRET:?GATEWAY_JWT_SECRET is required}
      GATEWAY_ENCRYPTION_KEY: ${GATEWAY_ENCRYPTION_KEY:?GATEWAY_ENCRYPTION_KEY is required}
      GATEWAY_DATABASE_URL: >-
        mysql+asyncmy://${MYSQL_USER:?MYSQL_USER is required}:${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}@mysql:3306/${MYSQL_DATABASE:?MYSQL_DATABASE is required}
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
      mysql-test-setup:
        condition: service_completed_successfully
      setup:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  mysql-test-setup:
    image: mysql:8.4@sha256:3466ba4a4828aa8d46fb7c3bc16b67b781c98413cf4ea0fac6feaa6e881faa26
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_TEST_DATABASE: ${MYSQL_TEST_DATABASE:-gateway_test}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - >-
        mysql --protocol=TCP --host=mysql --user=root
        --password="$$MYSQL_ROOT_PASSWORD"
        --execute="CREATE DATABASE IF NOT EXISTS \`$$MYSQL_TEST_DATABASE\`;
        GRANT ALL PRIVILEGES ON \`$$MYSQL_TEST_DATABASE\`.* TO '$$MYSQL_USER'@'%';
        FLUSH PRIVILEGES;"
    restart: "no"

volumes:
  mysql-data:
