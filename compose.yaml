services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gateway}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-gateway}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-gateway-root}
      MYSQL_USER: ${MYSQL_USER:-gateway}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$$MYSQL_PASSWORD"
          mysql --protocol=TCP --host=127.0.0.1 --connect-timeout=3
          --user="$$MYSQL_USER" --database="$$MYSQL_DATABASE"
          --batch --skip-column-names --execute="SELECT 1" >/dev/null
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      GATEWAY_DATABASE_URL: >-
        mysql+asyncmy://${MYSQL_USER:-gateway}:${MYSQL_PASSWORD:-gateway}@mysql:3306/${MYSQL_DATABASE:-gateway}
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      mysql-test-setup:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  mysql-test-setup:
    image: mysql:8.4
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-gateway}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-gateway-root}
      MYSQL_TEST_DATABASE: ${MYSQL_TEST_DATABASE:-gateway_test}
      MYSQL_USER: ${MYSQL_USER:-gateway}
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - >-
        mysql --protocol=TCP --host=mysql --user=root
        --password="$$MYSQL_ROOT_PASSWORD"
        --execute="CREATE DATABASE IF NOT EXISTS \`$$MYSQL_TEST_DATABASE\`;
        GRANT ALL PRIVILEGES ON \`$$MYSQL_TEST_DATABASE\`.* TO '$$MYSQL_USER'@'%';
        FLUSH PRIVILEGES;"
    restart: "no"

volumes:
  mysql-data:
