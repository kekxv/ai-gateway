services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: gateway
      MYSQL_PASSWORD: gateway
      MYSQL_ROOT_PASSWORD: gateway-root
      MYSQL_USER: gateway
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ugateway", "-pgateway"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      GATEWAY_DATABASE_URL: mysql+asyncmy://gateway:gateway@mysql:3306/gateway
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

volumes:
  mysql-data:
