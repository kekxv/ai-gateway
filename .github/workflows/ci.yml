name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: gateway
          MYSQL_PASSWORD: gateway
          MYSQL_ROOT_PASSWORD: gateway-root
          MYSQL_USER: gateway
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ugateway -pgateway"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      GATEWAY_DATABASE_URL: mysql+asyncmy://gateway:gateway@127.0.0.1:3306/gateway
      GATEWAY_TEST_DATABASE_URL: mysql+asyncmy://gateway:gateway@127.0.0.1:3306/gateway_test
      GATEWAY_ENVIRONMENT: test
      GATEWAY_JWT_SECRET: ci-jwt-secret-at-least-32-bytes-long
      GATEWAY_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      GATEWAY_NO_PROXY: 127.0.0.1,localhost
      NO_PROXY: 127.0.0.1,localhost
      no_proxy: 127.0.0.1,localhost
      MYSQL_DATABASE: gateway
      MYSQL_PASSWORD: gateway
      MYSQL_ROOT_PASSWORD: gateway-root
      MYSQL_USER: gateway

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.30"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Install locked frontend dependencies
        run: npm ci --prefix frontend

      - name: Create isolated test database
        run: >-
          mysql --protocol=TCP --host=127.0.0.1 --user=root --password=gateway-root
          --execute="CREATE DATABASE gateway_test;
          GRANT ALL PRIVILEGES ON gateway_test.* TO 'gateway'@'%'; FLUSH PRIVILEGES;"

      - name: Apply database migrations
        run: uv run alembic upgrade head

      - name: Lint
        run: uv run ruff check src tests scripts

      - name: Check formatting
        run: uv run ruff format --check src tests scripts

      - name: Type-check
        run: uv run mypy src scripts

      - name: Test with coverage
        run: >-
          uv run pytest -W error
          --cov=ai_gateway
          --cov-report=term-missing
          --cov-fail-under=90

      - name: Lint frontend
        run: npm --prefix frontend run lint

      - name: Type-check frontend
        run: npm --prefix frontend run typecheck

      - name: Test frontend
        run: npm --prefix frontend run test

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Install Chromium
        run: npm exec --prefix frontend -- playwright install --with-deps chromium

      - name: Run administrator browser acceptance tests
        run: |
          export GATEWAY_BOOTSTRAP_PASSWORD="$(openssl rand -hex 24)"
          trap 'unset GATEWAY_BOOTSTRAP_PASSWORD E2E_ADMIN_EMAIL E2E_ADMIN_PASSWORD' EXIT
          uv run python scripts/create_admin.py \
            --email console-e2e@example.com \
            --password-env GATEWAY_BOOTSTRAP_PASSWORD
          export E2E_ADMIN_EMAIL='console-e2e@example.com'
          export E2E_ADMIN_PASSWORD="$GATEWAY_BOOTSTRAP_PASSWORD"
          npm --prefix frontend run e2e

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Build production image
        run: docker build -t lean-ai-gateway:test .

  # ---------------------------------------------------------------
  # Publish the production image to GHCR — only after `quality`
  # (lint / type-check / tests / e2e / build) has passed AND only
  # on main / version-tag pushes (not on pull requests).
  # ---------------------------------------------------------------
  publish:
    needs: quality
    if: >-
      github.event_name == 'push'
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    secrets: inherit
