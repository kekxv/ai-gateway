name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: gateway
          MYSQL_PASSWORD: gateway
          MYSQL_ROOT_PASSWORD: gateway-root
          MYSQL_USER: gateway
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ugateway -pgateway"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      GATEWAY_DATABASE_URL: mysql+asyncmy://gateway:gateway@127.0.0.1:3306/gateway
      GATEWAY_TEST_DATABASE_URL: mysql+asyncmy://gateway:gateway@127.0.0.1:3306/gateway_test
      GATEWAY_ENVIRONMENT: test
      GATEWAY_JWT_SECRET: ci-jwt-secret-at-least-32-bytes-long
      GATEWAY_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      GATEWAY_NO_PROXY: 127.0.0.1,localhost
      MYSQL_DATABASE: gateway
      MYSQL_PASSWORD: gateway
      MYSQL_ROOT_PASSWORD: gateway-root
      MYSQL_USER: gateway

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.30"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Create isolated test database
        run: >-
          mysql --protocol=TCP --host=127.0.0.1 --user=root --password=gateway-root
          --execute="CREATE DATABASE gateway_test;
          GRANT ALL PRIVILEGES ON gateway_test.* TO 'gateway'@'%'; FLUSH PRIVILEGES;"

      - name: Apply database migrations
        run: uv run alembic upgrade head

      - name: Lint
        run: uv run ruff check src tests scripts

      - name: Check formatting
        run: uv run ruff format --check src tests scripts

      - name: Type-check
        run: uv run mypy src scripts

      - name: Test with coverage
        run: >-
          uv run pytest -W error
          --cov=ai_gateway
          --cov-report=term-missing
          --cov-fail-under=90

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Build production image
        run: docker build -t lean-ai-gateway:test .
